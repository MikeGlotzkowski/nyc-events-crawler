name: probe-sources
# Temporary: fetches candidate source URLs from a runner and commits what came back.
on:
  push:
    branches: [claude/project-thread-m1lrv6]
    paths: [.github/workflows/probe-sources.yml, probe/urls.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p probe/out
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          n=0
          : > probe/out/summary.txt
          while read -r u; do
            [ -z "$u" ] && continue
            n=$((n+1))
            for ua in "$UA" "fomo3-events-bot/1.0 (+https://github.com/fomo3)"; do
              tag=$([ "$ua" = "$UA" ] && echo chrome || echo bot)
              res=$(curl -sS -L --compressed --max-time 30 -A "$ua" -o "probe/out/$n-$tag.body" -w "%{http_code} %{content_type} %{size_download} %{url_effective}" "$u" 2>&1 || true)
              echo "$n $tag $u -> $res" >> probe/out/summary.txt
              head -c 400000 "probe/out/$n-$tag.body" > tmp && mv tmp "probe/out/$n-$tag.body" || true
            done
          done < probe/urls.txt
          cat probe/out/summary.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git commit -m "probe: source responses" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
