name: probe
on:
  push:
    branches: [claude/project-thread-a8ui9u]
    paths: [probe/urls.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node probe/probe.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/out && git commit -qm "probe output" && git push origin HEAD:${GITHUB_REF_NAME}
