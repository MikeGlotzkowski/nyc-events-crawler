name: "Source health"

# Opens (and later closes) a "Crawler health alert" issue when a crawler source
# keeps failing, stops finding events, or the upcoming feed gets thin.
# Also writes the data-quality report to the job summary; a source whose new events degrade
# goes into the same issue. Runs on its own schedule so it still fires if the crawls stop,
# and after the evening (Playwright) crawl.

on:
  schedule:
    - cron: "0 9,21 * * *"
  workflow_run:
    workflows: ["Tier 2 Crawlers (Playwright)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: source-health

permissions:
  contents: read
  issues: write

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: node health-check.js
