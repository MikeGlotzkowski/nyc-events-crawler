name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  # playwright is a production dependency and its postinstall downloads
  # browsers. The unit tests do not need them.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
